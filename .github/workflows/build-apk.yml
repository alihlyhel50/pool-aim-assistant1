
name: Build Pool Aim APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -eu

          echo "Repository files:"
          ls -la

          ZIP_FILE="PoolAimAssistant-Android-Kotlin-CI.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "Searching for ZIP files..."
            find . -type f -iname "*.zip" -print

            echo "::error::Expected ZIP not found at repository root."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP contents:"
          unzip -Z1 "$ZIP_FILE" | head -n 100
