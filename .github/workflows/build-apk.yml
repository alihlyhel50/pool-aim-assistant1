
name: Build Pool Aim APK

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project ZIP
        shell: bash
        run: |
          set -eu
          ZIP="PoolAimAssistant-Android-Kotlin-CI.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          echo "ZIP found"
          unzip -Z1 "$ZIP" | head -n 80


