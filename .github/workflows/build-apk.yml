
name: Build Pool Aim APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - "app/**"
      - "settings.gradle*"
      - "build.gradle*"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if find . -name settings.gradle.kts -o -name settings.gradle | grep -q .; then
            PROJECT_DIR=$(find . -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs dirname)
          else
            ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP found."
              echo "Upload the project ZIP or Android project files."
              exit 1
            fi

            mkdir -p extracted-project
            unzip -q "$ZIP_FILE" -d extracted-project

            PROJECT_DIR=$(find extracted-project \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing; cannot safely assume a Gradle version."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pool-Aim-Assistant-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
